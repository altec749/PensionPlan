<main class="page">
  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow">Pension Plan API</p>
      <h1>Retirement pot calculator</h1>
      <p class="lead">
        Enter your assumptions and send a request to the FastAPI backend.
      </p>
    </div>
    <div class="hero-card">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span>API base URL</span>
          <input
            type="text"
            formControlName="apiBase"
            placeholder="http://localhost:8000"
          />
          <small>Leave blank to use the same host as the UI.</small>
        </label>

        <div class="grid">
          <label class="field">
            <span>Retirement age</span>
            <input type="number" min="0" formControlName="retirement_age" />
            <small
              *ngIf="form.controls.retirement_age.touched && form.controls.retirement_age.invalid"
            >
              Enter a non-negative age.
            </small>
          </label>

          <label class="field">
            <span>Annual real return</span>
            <input
              type="number"
              step="0.001"
              formControlName="annual_real_return"
            />
            <small>Example: 0.04 for 4%.</small>
          </label>

          <label class="field">
            <span>Monthly drawdown</span>
            <input
              type="number"
              min="0"
              step="1"
              formControlName="monthly_drawdown"
            />
            <small
              *ngIf="form.controls.monthly_drawdown.touched && form.controls.monthly_drawdown.invalid"
            >
              Enter a non-negative amount.
            </small>
          </label>

          <label class="field">
            <span>Death age</span>
            <input type="number" min="1" formControlName="death_age" />
            <small>Defaults to 90.</small>
          </label>
        </div>

        <button class="action" type="submit" [disabled]="loading()">
          {{ loading() ? 'Calculating...' : 'Calculate required pot' }}
        </button>
      </form>
    </div>
  </header>

  <section class="result" *ngIf="loading() || error() || result()">
    <div class="status loading" *ngIf="loading()">Sending request...</div>
    <div class="status error" *ngIf="error()">{{ error() }}</div>
    <div class="status success" *ngIf="result()">
      <p class="label">Required pot at retirement</p>
      <div class="value">
        {{ result()?.required_pot_at_retirement | number: '1.0-2' }}
      </div>
      <p class="note" *ngIf="result()?.note">{{ result()?.note }}</p>
    </div>
  </section>
</main>
